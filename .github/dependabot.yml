version: 2
updates:
  # This kit ships no package manifest; the only machine-updatable dependency
  # surface is the pinned actions inside .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
